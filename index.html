<!DOCTYPE html>
<html lang="ko">
<head>

<style>

  *{box-sizing:border-box}

  .ans{background:#f3f6ee;border-left:4px solid var(--brand2);padding:12px 16px;border-radius:8px;margin-top:10px;white-space:pre-wrap}
  .ans.gray{border-color:#cfd8c3}
  .pts{margin:8px 0 0;padding-left:20px;color:var(--mute);font-size:14px} .pts li{margin-bottom:4px}
  .muted{color:var(--mute);font-size:14px}
  .player{display:flex;align-items:center;gap:14px;margin:8px 0}
  .player .bar{flex:1;height:6px;background:#e6e2f2;border-radius:3px;overflow:hidden}
  .player .bar i{display:block;height:100%;width:0;background:var(--brand2)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c1b2e;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .note{background:#fff8e6;border:1px solid #f4e2b0;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:12px}
  .fbitem{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:8px;padding:12px 14px;margin-top:10px;white-space:pre-wrap}
  .fbitem small{display:block;color:var(--mute);margin-bottom:4px} .fbitem .cat{display:inline-block;font-size:12px;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 8px;margin-right:6px}
  .fbgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px} @media(max-width:900px){.fbgrid{grid-template-columns:1fr}}
  .fbgrid .lab{font-weight:600;margin-bottom:6px}
  .rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .modal{position:fixed;inset:0;background:rgba(20,30,15,.45);display:flex;align-items:center;justify-content:center;z-index:30}
  .modal .box{background:#fff;border-radius:14px;padding:22px;width:min(360px,90vw)}
  .modal input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin:10px 0 14px}
  table.sub{width:100%;border-collapse:collapse;font-size:14px} table.sub td{padding:8px;border-top:1px solid var(--line);vertical-align:top} table.sub td:first-child{color:var(--mute);white-space:nowrap;width:120px} table.sub .zh{font-size:15px;line-height:1.75}
  .empty{color:var(--mute);text-align:center;padding:80px 20px}
  .exp{margin-top:8px;padding:10px 12px;border-radius:8px;background:#f7faf2;border:1px dashed #cfdcb8;font-size:14px}
  .exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
  .sol{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:760px}
  .sol summary{cursor:pointer;padding:12px 16px;font-weight:600;color:#2f4a1a;list-style:none} .sol summary::before{content:"▸ ";color:var(--brand)} .sol[open] summary::before{content:"▾ "}
  .sol .in{padding:0 16px 16px}
  .kr{font-size:14px;color:#4b5546;line-height:1.75;white-space:pre-wrap;background:#fafbf7;border-left:3px solid #cfdcb8;padding:10px 12px;border-radius:6px;margin-top:8px}
  .score{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:10px 0 18px;max-width:760px}
  .score .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px} .score .tile b{display:block;font-size:24px;color:var(--brand)} .score .tile small{color:var(--mute)}
  .wrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;max-width:900px}
  .wrow .meta{font-size:12px;color:var(--mute);white-space:nowrap;min-width:110px} .wrow .body{flex:1} .wrow.done{opacity:.55}
  .vocab{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:760px}
  .vocab summary{cursor:pointer;padding:10px 16px;font-weight:600;color:#2f4a1a;list-style:none;font-size:14px} .vocab summary::before{content:"▸ ";color:var(--brand)} .vocab[open] summary::before{content:"▾ "}
  .vocab table{width:100%;border-collapse:collapse;font-size:14px} .vocab td{padding:6px 16px;border-top:1px solid #eef3e4;vertical-align:top} .vocab td.w{font-size:17px;width:28%} .vocab td.py{color:var(--brand);width:28%}
  .score .tile{cursor:pointer} .score .tile:hover{border-color:var(--brand)}
  .rsec{margin-top:26px;padding-top:18px;border-top:2px solid var(--soft);max-width:900px} .rsec h3{margin:0 0 10px;font-size:17px;color:#2f4a1a}
  .rsec .ans{max-width:none} .rsec .pbox{max-width:none}
  .rq{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .rqh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:16px;margin-bottom:6px}
  .kr2{color:#6b7566;font-size:13.5px} .py{color:var(--brand);font-size:13px;margin:0 8px}
  .okb{color:var(--ok);font-weight:600;font-size:13px} .badb{color:var(--bad);font-weight:600;font-size:13px}
  .ropt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:5px 10px;border-radius:6px;font-size:15px} .ropt.right{background:#e4f2cf} .ropt.wrong{background:#fde3e3}
  .savew{margin-left:10px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer} .savew.on{background:var(--brand);color:#fff}
  .back{display:none}
  @media(max-width:900px){
    .shell{flex-direction:column} aside{width:100%;height:auto;position:static;border-right:0}

    .two,.two.wide{grid-template-columns:1fr}
    .back{display:inline-block} textarea{min-height:220px}
  }
</style>
</head>
<body class="home">
<div class="shell">
  <aside>
    <div class="brand"><img src="icon.png" alt=""><div><b>기솔의 HSK 5급 스터디룸</b><small id="brandSub">숙제 목록</small></div></div>
    <nav class="daylist" id="daylist"><p class="muted" style="text-align:center">불러오는 중…</p></nav>
    <div class="sidetools"><a href="#wrong-notes" id="wrongLink">📕 오답노트</a><a href="#listening-log" id="logLink">🎧 听力 연습기록</a></div>
    <div class="sidefoot"><span>© 2026 Bona Kim</span><a href="#" id="tlink">선생님</a></div>
  </aside>
  <main>
    <div class="topbar">
      <button class="btn sec back" id="back">‹ 목록</button>

      <div class="fsctl"><button class="fsb" id="fsMinus" title="글씨 작게">가-</button><span id="fsVal">100%</span><button class="fsb" id="fsPlus" title="글씨 크게">가+</button></div>

<script>
// ===== 설정 =====
const OWNER = "reallytoomanyrequests";   // GitHub 아이디
const REPO  = "HSK5-Homework";           // 저장소 이름
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycby6qTSRxxKt_NO2LQI5Gq5CpuR21pku6i3_Nmtu9rOs2xb2GqR0L6Eil3CQOa0OcCE6_A/exec";                   // Google Apps Script 웹 앱 URL (.../exec)
const STUDENT = "기솔";
// ================
const $ = s => document.querySelector(s);
const toast = (m) => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); };
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const fmtTime = v => { const d=new Date(v); return isNaN(d)?String(v):`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const kdate = d => { const dt=new Date(d.slice(0,10)+"T00:00:00"); const wd=["일","월","화","수","목","금","토"][dt.getDay()]; return {m:dt.getMonth()+1,d:dt.getDate(),wd}; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L = "ABCDEF";
const BLOBS = {};
// 녹음 원본을 브라우저 저장소(IndexedDB)에 보관해서 새로고침해도 남게
const idb={
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open("hsk-rec",1); r.onupgradeneeded=()=>r.result.createObjectStore("rec"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async put(k,v){ try{ const db=await this.open(); await new Promise((res,rej)=>{ const t=db.transaction("rec","readwrite"); t.objectStore("rec").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){} },
  async all(prefix){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const out={}; const t=db.transaction("rec","readonly"); const c=t.objectStore("rec").openCursor(); c.onsuccess=()=>{ const cur=c.result; if(!cur){ res(out); return; } if(String(cur.key).startsWith(prefix)) out[cur.key]=cur.value; cur.continue(); }; c.onerror=()=>rej(c.error); }); }catch(e){ return {}; } }
};
let teacherPin = store.get("teacherPin","");
const isTeacher = () => !!teacherPin;
let serverStatus = {};

// ---------- 서버 ----------
async function api(params){
  if(!SUBMIT_URL) return null;
  try{ const u=new URL(SUBMIT_URL); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); const r=await fetch(u,{redirect:"follow"}); return await r.json(); }catch(e){ return null; }
}
async function post(body){
  const r=await fetch(SUBMIT_URL,{method:"POST",body:JSON.stringify(body),redirect:"follow"});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok || j.ok===false) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function ask(title,{input=false,okText="확인",placeholder=""}={}){
  return new Promise(res=>{
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="box"><div style="font-weight:700;margin-bottom:4px">${title}</div>${input?`<input type="password" placeholder="${placeholder}">`:"<div style='height:12px'></div>"}<div class="row" style="justify-content:flex-end;margin:0"><button class="btn sec" data-a="no">취소</button><button class="btn" data-a="ok">${okText}</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{ m.remove(); res(v); };
    m.querySelector("[data-a=no]").onclick=()=>done(null);
    m.querySelector("[data-a=ok]").onclick=()=>done(input?m.querySelector("input").value:true);
    if(input){ const i=m.querySelector("input"); i.focus(); i.onkeydown=e=>{ if(e.key==="Enter") done(i.value); }; }
  });
}

// ---------- 알림 ----------
let NOTIS=[]; let pendingTab=null;
const seenSet=()=>new Set(store.get("notiSeen",[]));
const notiId=n=>`${n.type}|${n.day}|${n.cat||""}|${String(n.time).slice(0,16)}`;
async function loadNotis(){
  const r=await api({action:"feed"}); if(!r||!r.ok) return;
  const mine=isTeacher()?r.feed.filter(x=>x.type==="submission"):r.feed.filter(x=>x.type==="feedback");
  NOTIS=mine.sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,30);
  paintNotis();
}
function paintNotis(){
  const seen=seenSet(); const unseen=NOTIS.filter(n=>!seen.has(notiId(n)));
  const bd=$("#bbadge"); bd.style.display=unseen.length?"inline-block":"none"; bd.textContent=unseen.length;
  const k=d=>{ const x=kdate(d); return `${x.m}/${x.d} (${x.wd})`; };
  const dayNo=d=>{ const i=DAYS.indexOf(d); return i>=0?`Day ${DAYS.length-i}`:k(d); };
  $("#nlist").innerHTML=NOTIS.length?NOTIS.map(n=>{
    const id=notiId(n); const s=seen.has(id);
    const text=n.type==="feedback"?`${n.cat||""} 피드백을 확인해보세요${n.cat==="말하기"?"~!":"!"}`:`${STUDENT}이 숙제를 제출했어요${n.score?` (듣기·독해 ${n.score})`:""}`;
    return `<div class="nitem ${s?"seen":""}" data-id="${id}" data-day="${n.day}" data-tab="feedback"><span class="ic">${n.type==="feedback"?(n.cat==="쓰기"?"✍️":"🎤"):"📥"}</span><div>${text}<small>${dayNo(n.day)} · ${fmtTime(n.time)}</small></div></div>`;
  }).join(""):`<div class="nempty">아직 알림이 없어요</div>`;
  $("#nlist").querySelectorAll(".nitem").forEach(el=>el.onclick=()=>{
    const seen=seenSet(); seen.add(el.dataset.id); store.set("notiSeen",[...seen]); $("#notis").style.display="none";
    pendingTab="feedback"; if(decodeURIComponent(location.hash.slice(1))===el.dataset.day) route(); else location.hash=el.dataset.day;
    paintNotis();
  });
}
$("#bell").onclick=e=>{ e.stopPropagation(); const n=$("#notis"); n.style.display=n.style.display==="none"?"block":"none"; };

// ---------- 목록 ----------
let DAYS=[];
async function listDays(){
  let days=[];
  try{ const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/homework`,{cache:"no-store"}); if(r.ok){ const j=await r.json(); days=j.filter(x=>x.type==="dir"&&/^\d{4}-\d{2}-\d{2}/.test(x.name)).map(x=>x.name); } }catch(e){}
  if(!days.length){ try{ const r=await fetch("homework/index.json",{cache:"no-store"}); if(r.ok) days=await r.json(); }catch(e){} }
  return days.sort().reverse();
}
async function renderList(){
  const [days, st]=await Promise.all([listDays(), api({action:"all"})]);
  DAYS=days; serverStatus=(st&&st.days)||{};
  const cur=decodeURIComponent(location.hash.slice(1));
  if(!days.length){ $("#daylist").innerHTML=`<p class="muted" style="text-align:center;padding:20px">아직 올라온 숙제가 없어요.</p>`; return; }
  $("#daylist").innerHTML=days.map((d,i)=>{
    const key=d.slice(0,10); const s=serverStatus[key]; const local=store.get("hw:"+d,null); const k=kdate(d);
    const b=[];
    if(s?.submitted) b.push(`<span class="badge done">제출${s.score?` · 듣기 ${s.score}`:""}</span>`);
    else if(local?.submitted) b.push(`<span class="badge done">제출</span>`);
    else if(local) b.push(`<span class="badge doing">진행 중</span>`);
    else b.push(`<span class="badge new">새 숙제</span>`);
    if(s?.feedback) b.push(`<span class="badge fb">피드백 ${s.feedback}</span>`);
    return `<a href="#${d}" class="${d===cur?"active":""}"><div class="d"><span>Day ${days.length-i} <small>${k.m}/${k.d} (${k.wd})</small></span></div><div class="badges">${b.join("")}</div></a>`;
  }).join("");
  loadNotis();
}

function makePlayer(src,state,key){
  const wrap=document.createElement("div");
  const plays=state.plays?.[key]||0;
  wrap.innerHTML=`<div class="player"><button class="btn" data-act="play">▶ 재생</button><div class="bar"><i></i></div><span class="muted" data-role="t">0:00</span></div><div data-role="info" style="display:none"></div>`;
  const a=new Audio(src); a.preload="auto";
  const btn=wrap.querySelector("[data-act=play]"), bar=wrap.querySelector(".bar i"), t=wrap.querySelector("[data-role=t]"), info=wrap.querySelector("[data-role=info]");
  btn.onclick=async()=>{
    if(!a.paused){ a.pause(); btn.textContent="▶ 재생"; return; }
    const n=(state.plays?.[key]||0);
    if(n>=1 && a.currentTime===0 && !isTeacher() && !(await ask("이미 한 번 들었어요. 다시 들을까요? (횟수가 기록돼요)",{okText:"다시 듣기"}))) return;
    a.play().catch(()=>toast("재생할 수 없어요")); btn.textContent="❚❚ 일시정지";
  };
  a.onplay=()=>{ if(a.currentTime<0.2){ state.plays=state.plays||{}; state.plays[key]=(state.plays[key]||0)+1; saveState(state); info.textContent=`재생 ${state.plays[key]}회`; } };
  a.ontimeupdate=()=>{ if(a.duration){ bar.style.width=(a.currentTime/a.duration*100)+"%"; t.textContent=fmt(Math.floor(a.currentTime)); } };
  a.onended=()=>{ btn.textContent="▶ 다시 재생"; bar.style.width="100%"; a.currentTime=0; };
  return wrap;
}
function makeTimer(sec,label,onDone,opts={}){
  const el=document.createElement("div"); el.className="row";
  el.innerHTML=`<span class="muted">${label}</span><span class="timer">${fmt(sec)}</span><button class="btn sec" data-act="start">시작</button><span class="muted" data-role="total"></span>`;
  const disp=el.querySelector(".timer"), btn=el.querySelector("[data-act=start]"), tot=el.querySelector("[data-role=total]");
  let left=sec, elapsed=0, iv=null, fired=false;
  const tick=()=>{
    elapsed++; left--;
    if(left>=0){ disp.textContent=fmt(left); if(left<=10) disp.classList.add("warn"); }
    else { disp.textContent=fmt(elapsed); disp.classList.add("warn"); tot.textContent=`총 소요 시간 (제한 ${fmt(sec)})`; }
    if(left===0 && !fired){ fired=true; onDone&&onDone(); if(!opts.overrun){ clearInterval(iv); iv=null; btn.textContent="끝"; btn.disabled=true; } }
    opts.onTick && opts.onTick(elapsed);
  };
  btn.onclick=()=>{
    if(iv){ clearInterval(iv); iv=null; btn.textContent="계속"; return; }
    btn.textContent="일시정지"; iv=setInterval(tick,1000);
  };
  el._stop=()=>{ clearInterval(iv); iv=null; };
  return el;
}
function makeRecorder(day,name,state,key){
  const el=document.createElement("div");
  el.innerHTML=`<div class="row"><button class="btn bad" data-act="rec">● 녹음 시작</button><span data-role="st" class="muted"></span></div><div data-role="out"></div>`;
  const btn=el.querySelector("[data-act=rec]"), st=el.querySelector("[data-role=st]"), out=el.querySelector("[data-role=out]");
  let mr=null, chunks=[], t0=0, iv=null;
  if(state.recs?.[key]){ const b=BLOBS[key]; out.innerHTML=b?`<audio controls src="${URL.createObjectURL(b.blob)}" style="width:100%;margin:8px 0"></audio><div class="muted">녹음 ${state.recs[key]} · 제출하면 선생님께 같이 전송돼요</div>`:`<div class="muted">✔ 녹음 완료 (${state.recs[key]})${state.submitted?"":" · 원본이 없어요. 다시 녹음해 주세요"}</div>`; }
  btn.onclick=async()=>{
    if(mr && mr.state==="recording"){ mr.stop(); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
      mr=new MediaRecorder(stream, mime?{mimeType:mime}:{}); chunks=[];
      mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{
        clearInterval(iv); stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"}); const url=URL.createObjectURL(blob);
        const ext=(mr.mimeType||"").includes("mp4")?"m4a":"webm"; const fn=`${day}_${name}.${ext}`;
        const dur=Math.round((Date.now()-t0)/1000);
        out.innerHTML=`<audio controls src="${url}" style="width:100%;margin:8px 0"></audio><div class="muted">녹음 ${fmt(dur)} · 제출하면 선생님께 같이 전송돼요</div>`;
        state.recs=state.recs||{}; state.recs[key]=fmt(dur); saveState(state); BLOBS[key]={blob,name:fn,mime:blob.type}; idb.put(`${day}|${key}`,BLOBS[key]);
        btn.innerHTML="● 다시 녹음"; st.textContent="";
      };
      mr.start(); t0=Date.now(); btn.innerHTML="■ 녹음 끝내기"; st.innerHTML=`<span class="rec"></span> 00:00`;
      iv=setInterval(()=>{ st.innerHTML=`<span class="rec"></span> ${fmt(Math.round((Date.now()-t0)/1000))}`; },500);
    }catch(e){ toast("마이크 권한이 필요해요"); }
  };
  return el;
}
function saveState(s){ store.set("hw:"+s.day,s); }

// ---------- 말하기: 풀기 → (음성/준비) → 자동 녹음 → 종료 ----------
function makeSpeaking(day,sec,si,state,title){
  const key=`r${si}`; const base=`homework/${day}/`;
  const el=document.createElement("div");
  const done=()=>{ const b=BLOBS[key]; return b?`<audio controls src="${URL.createObjectURL(b.blob)}" style="width:100%;max-width:760px;margin:8px 0"></audio><div class="muted">녹음 ${state.recs?.[key]||""} · 제출하면 선생님께 같이 전송돼요</div>`:(state.recs?.[key]?`<div class="muted">✔ 녹음 완료 (${state.recs[key]})${state.submitted?"":" · 원본이 없어요. 다시 해주세요"}</div>`:""); };
  const idle=()=>{ el.innerHTML=`<div class="row"><button class="btn big" data-act="go">${title} 풀기</button></div>${done()}`; el.querySelector("[data-act=go]").onclick=run; };
  let mr=null, chunks=[], stream=null, t0=0, tm=null;
  async function run(){
    if(state.submitted){ toast("이미 제출한 숙제예요"); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ toast("마이크 권한이 필요해요"); return; }
    el.innerHTML=`<div data-role="stage"></div><div class="row tr-timer"><span class="muted" data-role="label"></span><span class="timer" data-role="clock">--:--</span><span data-role="rec" class="muted"></span><button class="btn" data-act="skip" style="display:none">🎙 녹음 시작</button><button class="btn sec" data-act="stop" style="display:none">답변 끝내기</button></div>`;
    const stage=el.querySelector("[data-role=stage]"), label=el.querySelector("[data-role=label]"), clock=el.querySelector("[data-role=clock]"), recI=el.querySelector("[data-role=rec]"), stopB=el.querySelector("[data-act=stop]"), skipB=el.querySelector("[data-act=skip]");
    if(sec.images) stage.insertAdjacentHTML("beforeend",`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:760px">${sec.images.map(im=>`<img src="${base+im}" style="width:100%;border-radius:10px;border:1px solid var(--line)">`).join("")}</div>`);
    if(sec.prompt) stage.insertAdjacentHTML("beforeend",`<div class="zh ans gray" style="max-width:760px">${sec.prompt}</div>`);
    const countdown=(secs,lab,onEnd)=>{ let left=secs; label.textContent=lab; clock.textContent=fmt(left); clock.classList.remove("warn"); clearInterval(tm);
      tm=setInterval(()=>{ left--; clock.textContent=fmt(Math.max(0,left)); if(left<=10) clock.classList.add("warn"); if(left<=0){ clearInterval(tm); onEnd(); } },1000); };
    const startRec=()=>{
      const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
      mr=new MediaRecorder(stream, mime?{mimeType:mime}:{}); chunks=[]; mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{ clearInterval(tm); stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"}); const ext=(mr.mimeType||"").includes("mp4")?"m4a":"webm"; const dur=Math.round((Date.now()-t0)/1000);
        state.recs=state.recs||{}; state.recs[key]=fmt(dur); saveState(state); BLOBS[key]={blob,name:`${day}_말하기${sec.part||si+1}_${si}.${ext}`,mime:blob.type}; idb.put(`${day}|${key}`,BLOBS[key]);
        toast("답변 녹음 완료"); idle(); };
      mr.start(); t0=Date.now(); recI.innerHTML=`<span class="rec"></span> 녹음 중`; stopB.style.display="inline-block"; stopB.onclick=()=>{ if(mr.state==="recording") mr.stop(); };
      countdown(sec.answerSec||120,"답변 시간",()=>{ if(mr.state==="recording") mr.stop(); });
    };
    const toAnswer=()=>{ skipB.style.display="none"; clearInterval(tm); startRec(); };
    skipB.onclick=toAnswer;
    const prepDone=()=>{ label.textContent="준비 끝"; clock.textContent="00:00"; clock.classList.remove("warn"); toast("준비 시간이 끝났어요. 🎙 녹음 시작을 누르세요"); };
    const prep=()=>{ skipB.style.display="inline-block"; countdown(sec.prepSec,"준비 시간",prepDone); };
    if(sec.audio){
      label.textContent="듣는 중"; clock.textContent="";
      stage.insertAdjacentHTML("beforeend",`<div class="muted" style="margin-top:8px">🔊 음성을 한 번 들려드립니다</div>`);
      const a=new Audio(base+sec.audio);
      a.onended=()=>{ state.plays=state.plays||{}; state.plays[`s${si}`]=(state.plays[`s${si}`]||0)+1; saveState(state); if(sec.prepSec) prep(); else { skipB.style.display="inline-block"; label.textContent="준비 끝"; clock.textContent="00:00"; } };
      a.play().catch(()=>toast("음성을 재생할 수 없어요"));
    } else if(sec.prepSec) prep(); else { skipB.style.display="inline-block"; label.textContent="준비 끝"; clock.textContent="00:00"; }
  }
  idle(); return el;
}

  try{ const r=await fetch(`homework/${day}/answers.json`,{cache:"no-store"}); if(r.ok) ans=await r.json(); }catch(e){}

  { const saved=await idb.all(`${day}|`); for(const k in saved){ const key=k.split("|")[1]; if(!BLOBS[key]) BLOBS[key]=saved[k]; } }

    return s;
  };
  const payload=async()=>{
    const p={day:day.slice(0,10),student:STUDENT,sections:[],writing:"",writingCount:0,writingTime:"",recordings:[],summary:summary()};
    for(const [si,sec] of set.sections.entries()){
      if(sec.type==="listening"||sec.type==="reading"){ const answers={}; sec.questions.forEach(q=>answers[q.n]=state.choices[`${si}_${q.n}`]||""); p.sections.push({type:sec.type,title:sec.title,answers,plays:state.plays?.[`s${si}`]||0}); }
      if(sec.type==="writing"){ const t=state.writing[`w${si}`]||""; p.writing+=(p.writing?"\n\n":"")+`[${sec.title}]\n`+t; p.writingCount+=t.replace(/\s/g,"").length;
        const e=state.times?.[`t${si}`]; if(e) p.writingTime+=(p.writingTime?", ":"")+`${fmt(e)}${sec.timeSec?` / 제한 ${fmt(sec.timeSec)}`:""}`; }
      if(sec.type==="speaking"){ const b=BLOBS[`r${si}`]; p.sections.push({type:"speaking",title:sec.title,recorded:!!state.recs?.[`r${si}`],dur:state.recs?.[`r${si}`]||"",attached:!!b});
        if(b){ const b64=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result.split(",")[1]); fr.readAsDataURL(b.blob);}); p.recordings.push({name:b.name,mime:b.mime,data:b64}); } }
    }
    return p;
  };
  const finish=()=>{ state.submitted=true; saveState(state); content.querySelectorAll("textarea:not(.fb)").forEach(t=>t.disabled=true); if(reveal){ reveal(); active="answers"; paintTabs(); window.scrollTo({top:0}); } sb.textContent="다시 제출"; renderList(); };
  sb.onclick=async()=>{
    const missingRec=set.sections.some((sec,si)=>sec.type==="speaking"&&state.recs?.[`r${si}`]&&!BLOBS[`r${si}`]&&!state.submitted);
    if(missingRec && !(await ask("녹음 원본이 사라진 항목이 있어요 (새로고침 때문). 그대로 제출할까요?",{okText:"제출"}))) return;
    if(!SUBMIT_URL){ finish(); toast("제출 완료 (정답이 열렸어요)"); return; }
    sb.disabled=true; sb.textContent="전송 중…";
    try{ const j=await post(await payload()); finish(); toast(j.score?`제출 완료! 듣기·독해 ${j.score}`:"제출 완료! 선생님께 전송됐어요"); renderStatus(await api({action:"status",day:day.slice(0,10),pin:""})); }
    catch(e){ console.error(e); toast("전송 실패. 인터넷 연결을 확인하고 다시 눌러주세요"); sb.textContent="다시 시도"; }
    sb.disabled=false;
  };
}
// ---------- 听力 연습기록 ----------
async function renderLog(){
  document.body.className="day";
  $("#title").innerHTML=`听力 연습기록<small>듣기 연습한 문제 기록</small>`; $("#tabs").innerHTML=""; $("#submit").style.display="none";
  document.querySelectorAll(".daylist a").forEach(a=>a.classList.remove("active")); $("#logLink").classList.add("active");
  const c=$("#content");
  const form={src:"",page:"",num:"",day:"",how:[],result:"",memo:""};
  c.innerHTML=`<div class="two">
    <div class="card" id="logForm">
      <h2>기록하기</h2>
      <div class="step"><div class="lab">어느 문제를 연습했나요?</div><div class="chips" data-f="src"><span class="chip" data-v="교재">교재</span><span class="chip" data-v="App">App</span></div></div>
      <div class="step" id="locBook" style="display:none"><div class="lab">교재 위치</div><div class="row"><label class="field"><input type="number" min="1" data-f="page" placeholder="쪽"> 쪽</label><label class="field"><input type="text" data-f="num" placeholder="번호"> 번</label></div><div class="muted">여러 문제면 번호를 쉼표나 물결로 (예: 1,2,5 / 3~8)</div></div>
      <div class="step" id="locApp" style="display:none"><div class="lab">App 위치</div><div class="row"><label class="field">Day <input type="number" min="1" data-f="day" placeholder="1"></label><label class="field"><input type="text" data-f="num2" placeholder="번호"> 번</label></div></div>
      <div class="step"><div class="lab">결과</div><div class="chips" data-f="result"><span class="chip" data-v="처음부터 맞음">처음부터 맞음</span><span class="chip" data-v="틀렸다가 이해함">틀렸다가 이해함</span><span class="chip" data-v="아직 어려움">아직 어려움</span></div></div>
      <div class="step"><div class="lab">메모 <span class="muted">(선택)</span></div><input class="wide" type="text" data-f="memo" placeholder="못 들은 단어, 헷갈린 표현 등" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px"></div>
      <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn big" id="logSave">저장</button></div>
    </div>
    <div class="card"><h2>기록</h2><div id="logList"><span class="muted">불러오는 중…</span></div></div>
  </div>`;
  const chipsOf=f=>[...c.querySelectorAll(`.chips[data-f=${f}] .chip`)];
  c.querySelectorAll(".chips").forEach(g=>{
    const f=g.dataset.f; const multi=(f==="how");
    g.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
      if(multi){ ch.classList.toggle("on"); form.how=chipsOf(f).filter(x=>x.classList.contains("on")).map(x=>x.dataset.v); }
      else { chipsOf(f).forEach(x=>x.classList.remove("on")); ch.classList.add("on"); form[f]=ch.dataset.v;
        if(f==="src"){ $("#locBook").style.display=form.src==="교재"?"block":"none"; $("#locApp").style.display=form.src==="App"?"block":"none"; } }
    });
  });
  c.querySelectorAll("input[data-f]").forEach(i=>i.oninput=()=>form[i.dataset.f]=i.value.trim());
  const localLogs=()=>store.get("listening-log",[]);
  const renderList=(rows)=>{
    const el=$("#logList"); if(!rows.length){ el.innerHTML=`<p class="muted">아직 기록이 없어요.</p>`; return; }
    el.innerHTML=`<table class="log"><tr><th>날짜</th><th>문제</th><th>결과</th><th>메모</th></tr>${rows.slice().reverse().slice(0,60).map(r=>`<tr><td style="white-space:nowrap">${fmtTime(r.time)}</td><td>${esc(r.where)}</td><td>${esc(r.result)}</td><td class="muted">${esc(r.memo)}</td></tr>`).join("")}</table>`;
  };
  const load=async()=>{ const r=await api({action:"logs"}); renderList((r&&r.ok&&r.logs)||localLogs()); };
  load();
  $("#logSave").onclick=async()=>{
    if(!form.src) return toast("교재 / App 중 하나를 골라주세요");
    let where="";
    if(form.src==="교재"){ if(!form.page) return toast("쪽수를 적어주세요"); where=`교재 ${form.page}쪽${form.num?` ${form.num}번`:""}`; }
    else { if(!form.day) return toast("Day를 적어주세요"); where=`App Day ${form.day}${form.num2?` ${form.num2}번`:""}`; }
    const rec={time:new Date().toISOString(),student:STUDENT,src:form.src,where,how:form.how.join(", "),result:form.result,memo:form.memo};
    const btn=$("#logSave"); btn.disabled=true; btn.textContent="저장 중…";
    try{
      if(SUBMIT_URL) await post({action:"log",...rec});
      else { const l=localLogs(); l.push(rec); store.set("listening-log",l); }
      toast("기록했어요"); await load();
      // 폼 초기화 (출처는 유지)
      c.querySelectorAll(".chips[data-f=result] .chip").forEach(x=>x.classList.remove("on")); form.result=""; form.memo=""; form.num=""; form.num2="";
      c.querySelectorAll("input[data-f=num],input[data-f=num2],input[data-f=memo]").forEach(i=>i.value="");
    }catch(e){ toast("저장 실패: "+e.message); }
    btn.disabled=false; btn.textContent="저장";
  };
}
// ---------- 오답노트 ----------
async function renderWrongs(){
  document.body.className="day";
  $("#title").innerHTML=`오답노트<small>틀린 문제 모음</small>`; $("#tabs").innerHTML=""; $("#submit").style.display="none";
  document.querySelectorAll(".daylist a").forEach(a=>a.classList.remove("active")); $("#wrongLink").classList.add("active");
  const c=$("#content"); c.innerHTML=`<p class="muted">불러오는 중…</p>`;
  let rows=null; const r=await api({action:"wrongs"}); if(r&&r.ok&&Array.isArray(r.wrongs)) rows=r.wrongs.map(x=>({...x,id:`${x.day}|${x.area}|${x.n}`,src:"server"}));
  if(!rows) rows=store.get("wrongs",[]).map(x=>({...x,src:"local"}));
  rows.sort((a,b)=>String(b.day||"").localeCompare(String(a.day||""))||(a.n-b.n));
  const paint=(filter)=>{
    const list=rows.filter(x=>filter==="all"||(filter==="todo"?x.status!=="복습 완료":x.status==="복습 완료"));
    c.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div class="chips"><span class="chip ${filter==="todo"?"on":""}" data-f="todo">복습 전</span><span class="chip ${filter==="done"?"on":""}" data-f="done">복습 완료</span><span class="chip ${filter==="all"?"on":""}" data-f="all">전체</span></div><span class="muted">${list.length}개</span></div>
      <div style="margin-top:14px">${list.length?list.map(w=>`<div class="wrow ${w.status==="복습 완료"?"done":""}"><div class="meta">${w.day?String(w.day).slice(5,10).replace("-","/"):""}<br>${esc(String(w.area))} ${w.n}번</div><div class="body"><div class="zh" style="font-size:16px">${w.q||""}</div><div class="muted">내 답 ${esc(String(w.mine||"-"))} → 정답 <b style="color:var(--ok)">${esc(String(w.answer))}</b></div>${w.explain?`<div class="muted" style="margin-top:4px">${w.explain}</div>`:""}</div><button class="btn sec" data-id="${w.id}">${w.status==="복습 완료"?"다시 복습":"복습 완료"}</button></div>`).join(""):`<p class="muted">여기에 해당하는 문제가 없어요.</p>`}</div></div>`;
    c.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>paint(ch.dataset.f));
    c.querySelectorAll("button[data-id]").forEach(bt=>bt.onclick=async()=>{
      const w=rows.find(x=>x.id===bt.dataset.id); const ns=w.status==="복습 완료"?"복습 전":"복습 완료"; w.status=ns;
      if(w.src==="server"&&SUBMIT_URL){ try{ await post({action:"wrong_status",row:w.row,status:ns}); }catch(e){ toast("저장 실패"); } }
      else { const all=store.get("wrongs",[]); const t=all.find(x=>x.id===w.id); if(t){ t.status=ns; store.set("wrongs",all); } }
      paint(filter);
    });
  };
  paint("todo");
}
function vocabBox(v,open){ return `<details class="vocab"${open?" open":""}><summary>📚 어휘 정리 (${v.length})</summary><table>${v.map(x=>`<tr><td class="w zh">${x.w}</td><td class="py">${x.py||""}</td><td>${x.kr||""}</td></tr>`).join("")}</table></details>`; }
function renderHome(){
  document.body.className="home";
  $("#title").textContent="숙제를 선택하세요"; $("#tabs").innerHTML=""; $("#submit").style.display="none";
  $("#content").innerHTML=`<div class="empty">왼쪽에서 날짜를 고르면 숙제가 열려요.</div>`;
  document.querySelectorAll(".daylist a").forEach(a=>a.classList.remove("active"));
}
$("#back").onclick=()=>{ location.hash=""; };
async function route(){
  if(!DAYS.length) await renderList();
  const h=decodeURIComponent(location.hash.slice(1));
  $("#logLink").classList.remove("active"); $("#wrongLink").classList.remove("active");
  if(h==="listening-log") renderLog(); else if(h==="wrong-notes") renderWrongs(); else if(h) renderDay(h); else { renderHome(); renderList(); }
}
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) renderList(); });
route();
